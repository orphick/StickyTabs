<!doctype html>
<!-- data-theme is pre-set so the first paint already has the palette; App overwrites it
     from settings.json a moment later. Without it the window flashes unstyled. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StickyTabs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
